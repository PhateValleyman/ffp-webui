name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?)$ ]]; then
            echo "Release tags must use vX.Y.Z (optionally with a prerelease suffix)." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PKG_NAME=ffp-webui-${version}-python3.13-static-UNVERIFIED.txz" >> "$GITHUB_ENV"
          echo "SRC_NAME=ffp-webui-${version}-source.tgz" >> "$GITHUB_ENV"
          echo "SUMS_NAME=ffp-webui-${version}-SHA256SUMS" >> "$GITHUB_ENV"

      - name: Run checks and tests
        run: |
          python3 -m py_compile ffp/ffp/bin/ffp-webui ffp/ffp/bin/ffp_webui_rclone.py ffp/ffp/bin/ffp_webui_luanti.py
          python3 -m unittest discover -s tests -v
          node --check internal/webui/assets/app.js
          sh -n build.sh ffp/ffp/start/ffp-webui.sh
          go test ./...

      - name: Build installer
        run: ./build.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged."
          else
            gh release create "$GITHUB_REF_NAME" --latest \
              "dist/$PKG_NAME" \
              "dist/$SRC_NAME" \
              "dist/$SUMS_NAME" \
              "README.md" \
              --title "FFP WebUI $VERSION" \
              --generate-notes
          fi
